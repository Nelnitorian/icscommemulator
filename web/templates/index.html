<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Scenario Manager</title>
    <link rel="stylesheet" href="/static/css/roboto.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Network Scenario Manager</h1>
            <p class="subtitle">Create and manage network simulation scenarios</p>
        </header>

        <main class="main-content">
            <nav class="action-buttons">
                <button id="newScenarioButton" class="button button-primary" onclick="showForm()">
                    <span class="button-icon">➕</span>
                    New Scenario
                </button>
                <button id="loadScenarioButton" class="button button-secondary" onclick="loadScenario()">
                    <span class="button-icon">📂</span>
                    Load Scenario
                </button>
            </nav>

            <!-- New Scenario Form -->
            <section id="form-container" class="form-container">
                <h2 class="section-title">Create New Scenario</h2>
                <form id="scenario-form" onsubmit="submitForm(event)">
                    <div class="form-group">
                        <label for="projectName">Project Name</label>
                        <input type="text" id="projectName" name="projectName" 
                               placeholder="Enter project name" required>
                    </div>

                    <div class="form-group">
                        <label for="ipSubrange">IP Subrange</label>
                        <input type="text" id="ipSubrange" name="ipSubrange" 
                               placeholder="192.168.100.0/24" required>
                    </div>

                    <div class="form-group">
                        <label for="protocol">Protocol</label>
                        <select id="protocol" name="protocol" required>
                            <option value="modbus">Modbus</option>
                            <option value="dnp3">DNP3</option>
                            <option value="iec104">IEC 104</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="masterNodes">Master Nodes</label>
                            <input type="number" id="masterNodes" name="masterNodes" 
                                   min="1" value="1" required>
                        </div>

                        <div class="form-group">
                            <label for="slaveNodes">Slave Nodes</label>
                            <input type="number" id="slaveNodes" name="slaveNodes" 
                                   min="1" value="2" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="button button-cancel" onclick="cancelForm()">
                            Cancel
                        </button>
                        <button type="submit" class="button button-success">
                            Create Scenario
                        </button>
                    </div>
                </form>
            </section>

            <!-- Load Scenario Section -->
            <section id="load-container" class="load-container">
                <h2 class="section-title">Available Scenarios</h2>
                <div id="scenario-list" class="scenario-grid"></div>
            </section>
        </main>
    </div>

    <script src="/static/js/ipaddr.min.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
